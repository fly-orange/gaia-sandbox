name: docker-smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - docker/**
      - src/**
      - vendor/**
      - pyproject.toml
      - uv.lock
      - tests/test_docker.py
jobs:
  sandbox:
    runs-on: ubuntu-latest
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      OPENHANDS_SUPPRESS_BANNER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv==0.12.7
      - run: uv sync --locked --extra test
      - run: docker build -f docker/sandbox.Dockerfile -t gaia-sandbox:0.2 .
      - run: RUN_DOCKER_TESTS=1 uv run pytest -m docker -q
