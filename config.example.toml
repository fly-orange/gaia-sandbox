[server]
host = "127.0.0.1"
port = 8765
max_concurrency = 4
request_timeout = 900
metrics_interval = 1.0
output_dir = "runs/server"

[llm]
# SDK runs in the shared HOST process, not inside each sandbox.
base_url = "http://127.0.0.1:8000/v1"
model = "openai/Qwen/Qwen3-32B"
api_key_env = "VLLM_API_KEY"
max_output_tokens = 8192
timeout = 120
max_iterations = 30
temperature = 0.0
num_retries = 3
vision = false

[agent]
tool_preset = "default"
enable_condenser = true
condenser_max_size = 240
condenser_keep_first = 2
max_fake_responses = 10
public_skills = true
# Keep both enabled for the upstream GAIA tool environment.
tavily = true
fetch = true
mcp_init_timeout = 60

[sandbox]
image = "gaia-sandbox:0.2"
cpus = 2.0
memory = "4g"
pids_limit = 256
command_timeout = 60
tool_startup_timeout = 180
tool_call_timeout = 360
shm_size = "1g"
# bridge permits web access. Use none for offline isolation tests.
# Docker networking alone is NOT an egress firewall; see README security section.
network = "bridge"

[gaia]
dataset_path = "data/GAIA"
split = "validation"
level = 1
limit = 3
workers = 1
output_dir = "runs/evaluation"
