[project]
name = "gaia-sandbox"
version = "0.2.0"
description = "One persistent OpenHands SDK service, isolated Docker sandbox per GAIA task"
requires-python = ">=3.12"
dependencies = [
  "openhands-sdk==1.27.0", "openhands-tools==1.27.0",
  "litellm==1.93.0", "browser-use==0.11.13", "fastmcp==3.1.0", "mcp==1.26.0",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "docker>=7.1,<8", "psutil>=6,<8", "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
data = ["pandas>=2.2", "pyarrow>=17", "huggingface-hub>=0.26"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]
sandbox = ["pandas>=2.2", "openpyxl", "pypdf", "python-docx", "python-pptx", "beautifulsoup4"]

[project.scripts]
gaia-sandbox = "gaia_shared.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gaia_shared"]

[tool.uv.sources]
openhands-sdk = { path = "vendor/software-agent-sdk/openhands-sdk", editable = true }
openhands-tools = { path = "vendor/software-agent-sdk/openhands-tools", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["docker: requires a local Linux Docker daemon and built sandbox image"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
